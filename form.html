<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5 mb-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
             <h1 >Student Registration</h1>
         </div>

<div class="card-body">
            <form>

                <div class="mb-3">
                    <label class="form-label">User Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name" required>
                </div>
               <div class="mb-3">
                    <label class="form-label">RollNumber</label>
                    <input type="roll" class="form-control" placeholder="Enter Roll number" required>
                  </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter email" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" placeholder="Enter phone number" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date-Of-Birth</label>
                    <input type="date" class="form-control">
                  </div>
                <div class="mb-3">
                    <label class="form-label">RollNumber</label>
                    <input type="roll" class="form-control" placeholder="Enter Roll number">
                  </div>
                 <div class="mb-3">
                    <label class="form-label">Gender</label>

    <input type="radio" name="gender">Male
    <input type="radio" name="gender" class="ms-3"> Female
    <input type="radio" name="gender" class="ms-3"> Other
          </div>
           <div>
    <label class="form-label">Branch</label>
    <select class="form-select">
        <option>Select Course</option>
        <option>CSE</option>
     <option>ECE</option>
          <option>EEE</option>
     <option>Mechanical</option>

        <option>Civil</option>
        </select>
          </div>
          <div class="mb-3">
                    <label class="form-label">Address</label>

    <textarea class="form-control" rows="3"></textarea>
      </div>


                 <div class="mb-3">
                    <label class="form-label">Upload Photo</label>

    <input type="file" class="form-control">
        
                </div>

                <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="terms" required>
    
    <label class="form-check-label" for="terms">
        I agree to the Terms and Conditions
    </label>
</div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success">Register</button>
                    <button type="reset" class="btn btn-danger">Reset</button>
                </div>
    
        
</form>
  </div>
    </div>
    </div>
     


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
